# Topic 1: Pods
# Smallest deployable unit in Kubernetes.
#
# Apply: kubectl apply -f pod.yaml
# Get:   kubectl get pods
# Describe: kubectl describe pod nginx-pod

apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
