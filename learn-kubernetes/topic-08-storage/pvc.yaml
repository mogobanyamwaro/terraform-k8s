# Topic 8: PersistentVolumes & PersistentVolumeClaims
# PVC requests storage; PV provides it (or dynamic provisioner creates both).
#
# Apply: kubectl apply -f .

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
