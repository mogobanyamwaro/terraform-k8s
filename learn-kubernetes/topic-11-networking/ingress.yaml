# Topic 11: Ingress & NetworkPolicy
# Ingress: HTTP routing. NetworkPolicy: allow/deny traffic.
#
# Apply: kubectl apply -f .
# Note: Ingress needs Ingress Controller (nginx, traefik) installed

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
spec:
  rules:
    - host: nginx.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
