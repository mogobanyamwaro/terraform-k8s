# Topic 14: Scheduling - Resource requests & limits
# Scheduler uses requests; kubelet enforces limits
#
# Apply: kubectl apply -f pod-resources.yaml

apiVersion: v1
kind: Pod
metadata:
  name: resource-pod
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
