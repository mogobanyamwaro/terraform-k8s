# Topic 14: Scheduling - Node Affinity
# Prefer/require nodes with specific labels
#
# First: kubectl label nodes <node-name> env=prod
# Apply: kubectl apply -f pod-affinity.yaml

apiVersion: v1
kind: Pod
metadata:
  name: affinity-pod
spec:
  containers:
    - name: nginx
      image: nginx:alpine
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: env
                operator: In
                values:
                  - prod
