# Topic 9: Multi-container Pods
# Sidecar, ambassador, adapter patterns. Shared network & storage.
#
# Apply: kubectl apply -f pod.yaml

apiVersion: v1
kind: Pod
metadata:
  name: multi-pod
spec:
  containers:
    - name: main
      image: nginx:alpine
      ports:
        - containerPort: 80
    - name: sidecar
      image: busybox
      command: ["sh", "-c", "while true; do echo sidecar; sleep 5; done"]
